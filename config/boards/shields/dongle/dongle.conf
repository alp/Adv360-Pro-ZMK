# --- DONGLE CONFIGURATION ---
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Accept both keyboard halves as peripherals
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

# BT connection limits: 2 peripherals + 5 BT profiles
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# High power transmission for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Battery level fetching disabled — known issue with 2-peripheral dongle setups
# (https://github.com/zmkfirmware/zmk/issues/3156)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n

# Disable features not needed on the dongle to save space
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n

# USB output
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_BUILD_OUTPUT_UF2=y

# HID settings (match keyboard halves)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y

# Pointing/mouse support (match keyboard)
CONFIG_ZMK_POINTING=y

# Clear bonds on boot — split re-pairs automatically in seconds.
# Required for dongle setup where NVS doesn't survive UF2 flashing.
CONFIG_ZMK_SETTINGS_RESET_ON_START=y
